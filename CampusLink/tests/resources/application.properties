# Configuração exclusiva dos testes. Não importa .env nem usa credenciais reais.
spring.application.name=CampusLinkTest
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/teste_nao_inicializado
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.mail.host=127.0.0.1
spring.mail.port=1
spring.mail.username=teste
spring.mail.password=teste
supabase.url=http://127.0.0.1:1
supabase.secret-key=teste-sem-credenciais
supabase.storage.bucket=teste
youtube.api.key=teste
googlebooks.api.key=teste
logging.level.root=WARN
logging.level.com.example.CampusLink=INFO
logging.level.io.zonky=INFO
