# configuracao do campuslink reune banco email arquivos integracoes e comportamento das respostas
spring.application.name=CampusLink

# verificacao por email define se o acesso exige um codigo
 campuslink.twofa.enabled=false

spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/CampusLink/.env[.properties]

# banco de dados define conexao atualizacao das tabelas e registro das consultas
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# envio de email configura o servidor e os limites de espera das mensagens
spring.mail.host=${BREVO_HOST}
spring.mail.port=${BREVO_PORT}
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.debug=false

# conexoes opcionais mantem os ajustes de quantidade e tempo de uso do banco desativados
#spring.datasource.hikari.pool-name=TravelBuddyPool
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.idle-timeout=30000
#spring.datasource.hikari.connection-timeout=20000
#spring.datasource.hikari.max-lifetime=1800000


# registro da aplicacao define os niveis de mensagens e o arquivo de destino
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.example=INFO


server.port=${PORT:8080}
# conexao segura mantem as opcoes de certificado desativadas
#server.port=8443
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=${KEYSTORE_PASSWORD}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tcc

#spring.thymeleaf.cache=false

# armazenamento de arquivos define o endereco a chave e a pasta remota
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# envio de arquivos limita o tamanho de cada arquivo e de cada solicitacao
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

youtube.api.key=${YOUTUBE_API_KEY}
googlebooks.api.key=${GOOGLE_BOOKS_API_KEY}

# documentacao das integracoes define os enderecos de consulta das rotas externas
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/googlebooks/**,/youtube/**
# paginas de erro ocultam detalhes internos nas respostas ao usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
