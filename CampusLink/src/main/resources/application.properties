# configuracao do campuslink reune banco email arquivos integracoes e comportamento das respostas
spring.application.name=CampusLink

# horizonte do planejamento define quantos dias a frente o score e o plano de estudos consideram, zero considera todos
campuslink.viabilidade.horizonte-dias=${VIABILIDADE_HORIZONTE_DIAS:90}

# verificacao por email define se o acesso exige um codigo
campuslink.twofa.enabled=true

spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/CampusLink/.env[.properties]

# banco de dados define conexao atualizacao das tabelas e registro das consultas
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# consultas fora do console evitam milhares de linhas de log em cada acesso
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# conexao por consulta evita que a pagina segure a conexao ate o fim e trave o pool com varios usuarios
spring.jpa.open-in-view=false
# pooler do supabase aceita 15 conexoes no total, com 5 por instancia cabem render + app local + reinicio sem esgotar
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# envio de email configura o servidor e os limites de espera das mensagens
spring.mail.host=${BREVO_HOST}
spring.mail.port=${BREVO_PORT}
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.debug=false
# nome fixo do servidor evita que o envio espere a busca do nome da maquina na rede
spring.mail.properties.mail.smtp.localhost=${MAIL_LOCALHOST:localhost}
spring.mail.properties.mail.host=${MAIL_LOCALHOST:localhost}

# conexoes opcionais mantem os ajustes de quantidade e tempo de uso do banco desativados
#spring.datasource.hikari.pool-name=TravelBuddyPool
#spring.datasource.hikari.maximum-pool-size=10
#spring.datasource.hikari.minimum-idle=2
#spring.datasource.hikari.idle-timeout=30000
#spring.datasource.hikari.connection-timeout=20000
#spring.datasource.hikari.max-lifetime=1800000


# registro da aplicacao define os niveis de mensagens e o arquivo de destino
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.example=INFO


server.port=${PORT:8080}
# conexao segura mantem as opcoes de certificado desativadas
#server.port=8443
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=${KEYSTORE_PASSWORD}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tcc

#spring.thymeleaf.cache=false

# compressao e cache deixam as paginas menores e evitam baixar de novo os arquivos que nao mudaram
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# cadeia de recursos testava cada link da pagina como arquivo e gastava metade da cpu, por isso fica desligada
spring.web.resources.chain.enabled=false
# navegador guarda os arquivos mas pergunta se mudaram, e recebe 304 rapido quando nao mudaram
spring.web.resources.cache.cachecontrol.no-cache=true
# render entrega https por um proxy, isso faz o app reconhecer a conexao segura e enviar o hsts
server.forward-headers-strategy=native
# cookie de sessao nao vai junto em formularios enviados por outros sites
server.servlet.session.cookie.same-site=lax

# armazenamento de arquivos define o endereco a chave e a pasta remota
supabase.url=${SUPABASE_URL}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}

# envio de arquivos limita o tamanho de cada arquivo e de cada solicitacao
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

youtube.api.key=${YOUTUBE_API_KEY}
googlebooks.api.key=${GOOGLE_BOOKS_API_KEY}

# documentacao das integracoes define os enderecos de consulta das rotas externas
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/googlebooks/**,/youtube/**
# paginas de erro ocultam detalhes internos nas respostas ao usuario
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
