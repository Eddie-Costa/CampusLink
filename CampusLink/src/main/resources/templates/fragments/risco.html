<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="selo(nivel, motivo)"
      class="selo-risco"
      th:classappend="${'risco-' + nivel}"
      th:title="${motivo}"
      th:switch="${nivel}">
    <th:block th:case="'verde'">Possível</th:block>
    <th:block th:case="'amarelo'">Replanejar</th:block>
    <th:block th:case="'vermelho'">Impossível</th:block>
    <th:block th:case="'concluido'">Concluído</th:block>
    <th:block th:case="'atrasado'">Atrasado</th:block>
    <th:block th:case="*">Sem evento próximo</th:block>
</span>

<span th:fragment="ponto(nivel)"
      th:with="rotulo=${nivel == 'verde' ? 'Possível' : (nivel == 'amarelo' ? 'Replanejar' : (nivel == 'vermelho' ? 'Impossível' : (nivel == 'concluido' ? 'Concluído' : (nivel == 'atrasado' ? 'Atrasado' : 'Sem evento próximo'))))}"
      th:class="${nivel == 'concluido' ? 'ponto-concluido' : 'ponto-risco risco-' + nivel}"
      th:title="${rotulo}"
      th:aria-label="${rotulo}"
      role="img"
      th:text="${nivel == 'concluido' ? '✔' : ''}"></span>

<span th:fragment="contadores(contagem)" class="d-inline-flex flex-wrap align-items-center gap-2">
    <span class="selo-risco risco-verde" th:text="${contagem.get('verde')}"
          th:title="${contagem.get('verde') + ' · Possível'}"
          th:aria-label="${contagem.get('verde') + ' alunos: possível'}">0</span>
    <span class="selo-risco risco-amarelo" th:text="${contagem.get('amarelo')}"
          th:title="${contagem.get('amarelo') + ' · Replanejar'}"
          th:aria-label="${contagem.get('amarelo') + ' alunos: replanejar'}">0</span>
    <span class="selo-risco risco-vermelho" th:text="${contagem.get('vermelho')}"
          th:title="${contagem.get('vermelho') + ' · Impossível'}"
          th:aria-label="${contagem.get('vermelho') + ' alunos: impossível'}">0</span>
    <span class="selo-risco risco-concluido" th:if="${contagem.get('concluido') > 0}" th:text="${contagem.get('concluido')}"
          th:title="${contagem.get('concluido') + ' · Concluído'}"
          th:aria-label="${contagem.get('concluido') + ' alunos: concluído'}">0</span>
    <span class="selo-risco risco-sem_evento" th:if="${contagem.get('sem_evento') > 0}" th:text="${contagem.get('sem_evento')}"
          th:title="${contagem.get('sem_evento') + ' · Sem evento próximo'}"
          th:aria-label="${contagem.get('sem_evento') + ' alunos: sem evento próximo'}">0</span>
</span>
</body>
</html>
