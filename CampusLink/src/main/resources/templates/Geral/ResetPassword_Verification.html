<!-- recuperar senha pede o email da conta para enviar o codigo de redefinicao -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | CampusLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/Usuarios/acesso.css(v=20261112-4)}">
</head>
<body class="pagina-acesso">

<div th:replace="~{fragments/header :: nav}"></div>

<main class="acesso">
    <div class="acesso-fundo" aria-hidden="true"><span></span><span></span><span></span></div>

    <section class="acesso-cartao" aria-labelledby="tituloRecuperar">
        <aside class="acesso-lateral">
            <div class="acesso-selo"><img th:src="@{/images/LogoCampusLink.png}" alt="CampusLink"></div>
            <h2 class="acesso-lateral-titulo">Esqueceu a senha? Acontece.</h2>
            <ul class="acesso-beneficios">
                <li><span class="acesso-beneficio-icone"><svg th:replace="~{fragments/icones-acesso :: email}"></svg></span>
                    Enviamos um código para o e-mail da sua conta</li>
                <li><span class="acesso-beneficio-icone"><svg th:replace="~{fragments/icones-acesso :: cadeado}"></svg></span>
                    Depois é só criar uma senha nova</li>
            </ul>
        </aside>

        <div class="acesso-conteudo">
            <span class="acesso-etiqueta">Recuperar acesso</span>
            <h1 id="tituloRecuperar" class="acesso-titulo">Recuperar senha</h1>
            <p class="acesso-subtitulo">Informe o e-mail cadastrado para receber o código de verificação.</p>

            <div th:if="${mensagemDeErro != null}" class="acesso-aviso acesso-aviso-erro" role="alert" th:text="${mensagemDeErro}"></div>

            <form action="/ResetVerification" th:object="${ResetVerification}" method="post" class="acesso-form" data-submit-once>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="acesso-campo">
                    <label for="email">E-mail</label>
                    <div class="campo-icone">
                        <svg th:replace="~{fragments/icones-acesso :: email}"></svg>
                        <input id="email" name="email" th:value="${email}" type="email" autocomplete="email"
                               placeholder="seuemail@exemplo.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="acesso-botao">
                    Enviar código <svg th:replace="~{fragments/icones-acesso :: seta}"></svg>
                </button>
            </form>

            <p class="acesso-rodape">Lembrou a senha? <a href="/login">Entrar</a></p>
            <p class="acesso-rodape acesso-rodape-discreto">Ainda não tem conta? <a href="/cadastrar">Cadastre-se</a></p>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
