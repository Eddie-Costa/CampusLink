<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/ResetPassword_VerificationStyle.css}">
    <title>Verificação de email</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <div th:replace="~{fragments/header :: nav}"></div>

    <main>

        <h1 class="title">Recuperar Senha</h1>

        <form action="/ResetVerification" th:object="${ResetVerification}" method="post" class="form-ResetVerification">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="label_info">E-mail</label>
            <input name="email" th:value="${email}" type="email" required class="textbox">

            <button type="submit" class="Sendbutton">Enviar Codigo de Verificação</button>
            <p name="mensagemDeErro" th:text="${mensagemDeErro}"></p>

            <a href="/login" class="link_pull">Ja tem cadastro em nossa plataforma? clique aqui para Logar</a>
            <a href="/cadastrar" class="link_pull">Ainda não está cadastrado em nossa plataforma? clique aqui para cadastrar-se</a>

        </form>

    </main>
</body>
</html>
