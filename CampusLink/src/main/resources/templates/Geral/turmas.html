
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/homeStyle.css}">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <div th:replace="~{fragments/header :: nav}"></div>

    <h1>Turmas</h1>

    <div th:if="${session.tipoUsuario == 'aluno'}">
        <a href="/buscarTurma" class="nav-link px-2">Buscar Turma</a>
    </div>

    <div th:if="${session.tipoUsuario == 'professor'}">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#criarTurmaModal">Criar turma</button>
        <div class="modal fade" id="criarTurmaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Criar turma</h5>
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                        </button>
                    </div>

                    <form th:action="@{/criarTurma}"
                        th:object="${turma}"
                        method="post">

                        <div class="modal-body">
                            <label for="nomeTurma">Nome da turma</label>
                            <input id="nomeTurma"
                                type="text"
                                th:field="*{nomeTurma}"
                                required>

                            <div th:if="${#fields.hasErrors('nomeTurma')}"
                                th:errors="*{nomeTurma}">
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button"
                                    class="btn btn-secondary"
                                    data-bs-dismiss="modal">
                                Cancelar
                            </button>

                            <button type="submit"
                                    class="btn btn-primary">
                                Criar turma
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
