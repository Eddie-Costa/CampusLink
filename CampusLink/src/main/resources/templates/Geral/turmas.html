<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turmas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/turmasStyle.css}">
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="turmas-page">
    <div class="turmas-container">

        <div class="sem-turmas" th:if="${#lists.isEmpty(turmas)}">
            <p>Você ainda não está em nenhuma turma.</p>
        </div>

        <div class="lista-turmas" th:unless="${#lists.isEmpty(turmas)}">
            <a class="turma-card" th:each="turma : ${turmas}" th:href="@{/turmas/{id}(id=${turma.id})}">
                <div class="turma-icon">
                    <i class="bi bi-person-circle"></i>
                </div>

                <span class="turma-nome" th:text="${turma.nomeTurma}">Turma #1</span>
            </a>
        </div>

        <div th:if="${session.tipoUsuario == 'aluno'}">
            <a href="/buscarTurma" class="acao-turma">Buscar Turmas</a>
        </div>

        <div th:if="${session.tipoUsuario == 'professor'}">
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#criarTurmaModal">Criar Turma</button>

            <div class="modal fade" id="criarTurmaModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title">Criar turma</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/criarTurma}" th:object="${turma}" method="post">
                            <div class="modal-body">

                                <label for="nomeTurma" class="form-label">Nome da turma</label>

                                <input id="nomeTurma" type="text" class="form-control" th:field="*{nomeTurma}" placeholder="Ex: Engenharia de Software" required>

                                <div class="erro-campo" th:if="${#fields.hasErrors('nomeTurma')}" th:errors="*{nomeTurma}"></div>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Criar turma</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

</body>
</html>
