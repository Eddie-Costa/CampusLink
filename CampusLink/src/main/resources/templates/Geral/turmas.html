<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turmas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/turmasStyle.css}">
</head>

<body>


<div th:replace="~{fragments/header :: nav}"></div>

<div th:if="${mensagemSucesso != null}" class="alert alert-success alert-dismissible fade show alerta-flutuante" role="alert">
    <span th:text="${mensagemSucesso}">Mensagem de sucesso</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>

<div th:if="${mensagemErro != null}" class="alert alert-warning alert-dismissible fade show alerta-flutuante" role="alert">
    <span th:text="${mensagemErro}">Mensagem de erro</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>

<main class="turmas-page">
    <div class="turmas-container">

        <div class="busca-turma-container" th:if="${!#lists.isEmpty(turmas)}">
            <input type="text"
               id="buscaTurma"
               class="busca-turma"
               placeholder="Qual turma está procurando?"
                   role="combobox"
                   aria-autocomplete="list"
                   aria-controls="sugestoesTurma"
                   aria-expanded="false">
            <div id="sugestoesTurma" class="sugestoes-turma" role="listbox" hidden></div>
        </div>

        <div class="turmas-acoes" th:if="${session.tipoUsuario == 'professor'}">
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#criarTurmaModal">Criar Turma</button>

            <div class="modal fade" id="criarTurmaModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title">Criar turma</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/criarTurma}" th:object="${turma}" method="post" data-submit-once>
                            <div class="modal-body">

                                <label for="nomeTurma" class="form-label">Nome da turma</label>
                                <input id="nomeTurma" type="text" class="form-control" th:field="*{nomeTurma}" placeholder="Ex: Engenharia de Software" required>
                                <div class="erro-campo" th:if="${#fields.hasErrors('nomeTurma')}" th:errors="*{nomeTurma}"></div>

                                <label for="descricaoTurma" class="form-label mt-3">Descrição da turma</label>
                                <textarea id="descricaoTurma" class="form-control" th:field="*{descricao}" rows="3" placeholder="Descreva a turma, objetivos, conteúdo ou observações..."></textarea>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Criar turma</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
        <div class="sem-turmas" th:if="${#lists.isEmpty(turmas)}">
            <p>Você ainda não está em nenhuma turma.</p>
        </div>

        <div class="lista-turmas" id="listaTurmas" th:unless="${#lists.isEmpty(turmas)}">
            <a class="turma-card" th:each="turma : ${turmas}" th:href="@{/turmas/{id}(id=${turma.id})}" th:attr="aria-label=${turma.nomeTurma}">
                <div class="turma-icon">
                    <i class="bi bi-person-circle"></i>
                </div>

                <span class="turma-nome" th:text="${turma.nomeTurma}" th:title="${turma.nomeTurma}">Turma #1</span>
            </a>
        </div>


    </div>
</main>

<script>
    const inputBusca = document.getElementById('buscaTurma');
    if (inputBusca) {
        const sugestoes = document.getElementById('sugestoesTurma');
        const buscaContainer = inputBusca.closest('.busca-turma-container');
        const cartoes = Array.from(document.querySelectorAll('#listaTurmas .turma-card'));
        const normalizar = texto => texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

        function fecharSugestoes() {
            sugestoes.replaceChildren();
            sugestoes.hidden = true;
            inputBusca.setAttribute('aria-expanded', 'false');
        }

        inputBusca.addEventListener('input', () => {
            const termo = normalizar(inputBusca.value.trim());
            const correspondencias = [];

            cartoes.forEach(card => {
                const nome = card.querySelector('.turma-nome').textContent.trim();
                const corresponde = normalizar(nome).includes(termo);
                card.style.display = corresponde ? '' : 'none';
                if (termo && corresponde) correspondencias.push({ nome, href: card.href });
            });

            sugestoes.replaceChildren();
            if (!termo) {
                sugestoes.hidden = true;
            } else if (correspondencias.length) {
                correspondencias.forEach(({ nome, href }) => {
                    const opcao = document.createElement('a');
                    opcao.className = 'sugestao-turma';
                    opcao.href = href;
                    opcao.setAttribute('role', 'option');
                    opcao.textContent = nome;
                    sugestoes.appendChild(opcao);
                });
                sugestoes.hidden = false;
            } else {
                const vazio = document.createElement('span');
                vazio.className = 'sugestao-turma-vazia';
                vazio.textContent = 'Nenhuma turma encontrada';
                sugestoes.appendChild(vazio);
                sugestoes.hidden = false;
            }

            inputBusca.setAttribute('aria-expanded', String(!sugestoes.hidden));
        });

        document.addEventListener('click', evento => {
            if (!buscaContainer.contains(evento.target)) fecharSugestoes();
        });
    }
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
