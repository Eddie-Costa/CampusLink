<!-- listar turmas apresenta busca cartoes de turmas recentes e formulario de criacao -->
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/turmasStyle.css}">
    <link rel="stylesheet" th:href="@{/css/Geral/turmas-resumo.css(v=20261112-2)}">
</head>

<body>


<div th:replace="~{fragments/header :: nav}"></div>

<div th:if="${mensagemSucesso != null}" class="alert alert-success alert-dismissible fade show alerta-flutuante" role="alert">
    <span th:text="${mensagemSucesso}">Mensagem de sucesso</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>

<div th:if="${mensagemErro != null}" class="alert alert-warning alert-dismissible fade show alerta-flutuante" role="alert">
    <span th:text="${mensagemErro}">Mensagem de erro</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>

<main class="turmas-page">
    <div class="turmas-container">

        <div class="busca-turma-container" th:if="${!#lists.isEmpty(turmas)}">
            <input type="text"
               id="buscaTurma"
               class="busca-turma"
               placeholder="Qual turma está procurando?"
                   role="combobox"
                   aria-autocomplete="list"
                   aria-controls="sugestoesTurma"
                   aria-expanded="false">
            <div id="sugestoesTurma" class="sugestoes-turma" role="listbox" hidden></div>
        </div>

        <div class="turmas-acoes" th:if="${session.tipoUsuario == 'professor'}">
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#criarTurmaModal">Criar Turma</button>

            <div class="modal fade" id="criarTurmaModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title">Criar turma</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/criarTurma}" th:object="${turma}" method="post" data-submit-once>
                            <div class="modal-body">

                                <label for="nomeTurma" class="form-label">Nome da turma</label>
                                <input id="nomeTurma" type="text" class="form-control" th:field="*{nomeTurma}"
                                       maxlength="100" required placeholder="Ex: Engenharia de Software">
                                <div class="erro-campo" th:if="${#fields.hasErrors('nomeTurma')}" th:errors="*{nomeTurma}"></div>

                                <label for="descricaoTurma" class="form-label mt-3">Descrição da turma</label>
                                <textarea id="descricaoTurma" class="form-control" th:field="*{descricao}"
                                          maxlength="1000" rows="3"
                                          placeholder="Descreva a turma, objetivos, conteúdo ou observações..."></textarea>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Criar turma</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
        <div class="sem-turmas" th:if="${#lists.isEmpty(turmas)}">
            <p>Você ainda não está em nenhuma turma.</p>
        </div>

        <th:block th:unless="${turmasRecentes == null or #lists.isEmpty(turmasRecentes)}">
            <h2 class="h5 fw-bold mb-3">Recentes</h2>

            <div class="lista-turmas mb-4">
                <a class="turma-card" th:each="turma : ${turmasRecentes}" th:href="@{/turmas/{id}(id=${turma.id})}" th:attr="aria-label=${turma.nomeTurma}">
                    <div class="turma-icon">
                        <i class="bi bi-clock-history"></i>
                    </div>

                    <span class="turma-nome" th:text="${turma.nomeTurma}" th:title="${turma.nomeTurma}">Turma #1</span>
                </a>
            </div>

            <h2 class="h5 fw-bold mb-3">Todas as turmas</h2>
        </th:block>

        <div class="lista-turmas" id="listaTurmas" th:unless="${#lists.isEmpty(turmas)}">
            <a class="turma-card" th:each="turma : ${turmas}" th:href="@{/turmas/{id}(id=${turma.id})}" th:attr="aria-label=${turma.nomeTurma}"
               th:with="resumo=${resumoTurmas != null ? resumoTurmas.get(turma.id) : null}">
                <div class="turma-icon">
                    <i class="bi bi-person-circle"></i>
                </div>

                <span class="turma-nome" th:text="${turma.nomeTurma}" th:title="${turma.nomeTurma}">Turma #1</span>
                <span class="turma-descricao" th:if="${turma.descricao != null and !#strings.isEmpty(turma.descricao)}"
                      th:text="${turma.descricao}" th:title="${turma.descricao}"></span>

                <!-- progresso do aluno mostra quantos conteudos da turma ja foram concluidos -->
                <div class="turma-progresso" th:if="${resumo != null and resumo.get('concluidos') != null}"
                     th:with="total=${resumo.get('conteudos')}, feitos=${resumo.get('concluidos')},
                              percentual=${total > 0 ? (feitos * 100 / total) : 0}">
                    <div class="turma-progresso-barra" role="progressbar" th:attr="aria-valuenow=${percentual},aria-label=${'Progresso em ' + turma.nomeTurma}"
                         aria-valuemin="0" aria-valuemax="100">
                        <span th:style="${'width:' + percentual + '%'}"></span>
                    </div>
                    <span class="turma-progresso-texto"
                          th:text="${total == 0 ? 'Nenhum conteúdo ainda' : feitos + ' de ' + total + (total == 1 ? ' conteúdo concluído' : ' conteúdos concluídos')}"></span>
                </div>

                <!-- numeros do professor mostram alunos conteudos e eventos da turma -->
                <div class="turma-numeros" th:if="${resumo != null and resumo.get('alunos') != null}">
                    <span th:text="${resumo.get('alunos') + (resumo.get('alunos') == 1 ? ' aluno' : ' alunos')}"></span>
                    <span th:text="${resumo.get('conteudos') + (resumo.get('conteudos') == 1 ? ' conteúdo' : ' conteúdos')}"></span>
                    <span th:text="${resumo.get('eventos') + (resumo.get('eventos') == 1 ? ' evento' : ' eventos')}"></span>
                </div>
            </a>
        </div>


    </div>
</main>

<script th:src="@{/js/Geral/buscaTurmas.js}"></script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
