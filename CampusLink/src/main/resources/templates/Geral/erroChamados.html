<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atendimento indisponível | CampusLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/chamados.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<main class="chamados-page chamados-form-page">
    <section class="chamados-card" role="alert">
        <h1>Não foi possível acessar os chamados</h1>
        <p>Tente novamente em alguns instantes. Antes de reenviar uma solicitação, confira se ela já aparece na lista.</p>
        <a th:href="${session.tipoUsuario == 'admin'} ? @{/admin/chamados} : @{/meus-chamados}" class="btn btn-primary">Consultar chamados</a>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
