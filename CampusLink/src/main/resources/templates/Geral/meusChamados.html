<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus chamados | CampusLink</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/chamados.css}">
</head>
<body>
<div th:replace="~{fragments/header :: nav}"></div>
<main class="chamados-page">
    <header class="chamados-topo">
        <div>
            <p class="chamados-etiqueta">Atendimento CampusLink</p>
            <h1>Meus chamados</h1>
            <p>Acompanhe suas solicitações e leia as respostas da administração.</p>
        </div>
        <a th:href="@{/ajuda}" class="btn btn-primary">Abrir chamado</a>
    </header>
    <section class="chamados-card chamados-vazio" th:if="${#lists.isEmpty(chamados)}">
        <h2>Você ainda não abriu chamados</h2>
        <p>Precisa de ajuda com o CampusLink? Envie sua primeira solicitação.</p>
        <a th:href="@{/ajuda}" class="btn btn-outline-primary">Ir para o canal de ajuda</a>
    </section>
    <div class="chamados-lista">
        <article class="chamados-card" th:each="chamado : ${chamados}">
            <div class="chamados-linha">
                <span class="chamados-protocolo" th:text="|Chamado #${chamado.id}|"></span>
                <span class="chamados-status" th:classappend="${chamado.status}" th:text="${chamado.statusDescricao}"></span>
            </div>
            <h2><a th:href="@{/meus-chamados/{id}(id=${chamado.id})}" th:text="${chamado.assunto}"></a></h2>
            <p class="chamados-resumo" th:text="${chamado.descricao}"></p>
            <div class="chamados-linha">
                <span class="text-secondary" th:text="|Aberto em ${#temporals.format(chamado.createdAt, 'dd/MM/yyyy HH:mm')}|"></span>
                <a th:href="@{/meus-chamados/{id}(id=${chamado.id})}" class="btn btn-outline-primary btn-sm"
                   th:attr="aria-label=|Ver detalhes do chamado #${chamado.id}|">Ver chamado e respostas</a>
            </div>
        </article>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
