<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação 2FA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Usuarios/verificarStyle.css}">

</head>

<body class="pagina-autenticacao">

<div th:replace="~{fragments/header :: nav}"></div>

<main>

    <form th:action="@{/verificar}" method="post" class="form-verificacao form-autenticacao"
          data-submit-once>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label id="codigoLabel" for="codigo-1" class="label_info">Código de verificação</label>
        <p id="descricaoCodigo" class="descricao-codigo">Para concluir seu acesso, digite o código de 6 dígitos enviado para seu e-mail.</p>

        <div class="codigo-inputs" role="group" aria-labelledby="codigoLabel" aria-describedby="descricaoCodigo">
            <input type="hidden" id="codigo" name="codigo">
            <input type="text" id="codigo-1" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="6" autocomplete="one-time-code" aria-label="Dígito 1 do código" required>
            <input type="text" id="codigo-2" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Dígito 2 do código" required>
            <input type="text" id="codigo-3" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Dígito 3 do código" required>
            <input type="text" id="codigo-4" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Dígito 4 do código" required>
            <input type="text" id="codigo-5" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Dígito 5 do código" required>
            <input type="text" id="codigo-6" class="codigo-digit" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="off" aria-label="Dígito 6 do código" required>
        </div>

        <button type="submit" class="Sendbutton">Verificar</button>

    </form>

    <p th:if="${erro}" th:text="${erro}" class="mensagemErro"></p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/Geral/verificar.js}"></script>
</body>
</html>
