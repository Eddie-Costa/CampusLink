<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação 2FA</title>
    <link rel="stylesheet" th:href="@{/css/Usuarios/verificarStyle.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/verificarStyle.css}">

</head>

<body class="pagina-autenticacao">

<div th:replace="~{fragments/header :: nav}"></div>

<main>

    <h2 class="title">Verificação duas etapas</h2>

    <form th:action="@{/verificar}" method="post" class="form-verificacao form-autenticacao">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label for="codigo" class="label_info">Código de verificação</label>

        <input type="text" id="codigo" name="codigo" placeholder="Digite o código recebido" autocomplete="one-time-code" required class="textbox">

        <button type="submit" class="Sendbutton">Verificar</button>

    </form>

    <p th:if="${erro}" th:text="${erro}" class="mensagemErro"></p>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
