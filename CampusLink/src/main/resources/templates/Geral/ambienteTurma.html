<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="${turma.nomeTurma}">Ambiente da turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/homeStyle.css}">
    <link rel="stylesheet" th:href="@{/css/turmasStyle.css}">
</head>
<body th:with="abrirModalConteudo=${abrirModalAdicionarConteudo != null and abrirModalAdicionarConteudo}">
<div th:replace="~{fragments/header :: nav}"></div>

<main class="turmas-page">
    <div class="turmas-container">

        <a th:href="@{/turmas}" class="voltar-turmas">&larr; Voltar para turmas</a>
        <h1 th:text="${turma.nomeTurma}">Nome da turma</h1>
        <p th:text="${turma.descricao}">Descrição da turma</p>
        <!-- LISTA DE CONTEÚDOS -->
        <div class="lista-conteudos mt-4">

            <div class="conteudo-card" th:each="conteudo, iter : ${conteudos}">
                <span class="conteudo-nome" th:text="${conteudo.titulo}">Conteúdo</span>

                <div class="conteudo-meta">
                    <span th:if="${conteudo.duracaoEstimada != null and !conteudo.duracaoEstimada.isBlank()}"
                          th:text="${conteudo.duracaoEstimada}">Tempo</span>

                    <a th:if="${conteudo.url != null and !conteudo.url.isBlank()}"
                       th:href="${conteudo.url}" target="_blank" rel="noopener" class="conteudo-link">
                        Abrir link
                    </a>
                </div>
            </div>

            <div class="sem-turmas" th:if="${#lists.isEmpty(conteudos)}">
                <p>Essa turma ainda não possui conteúdos cadastrados.</p>
            </div>

        </div>
        <div th:if="${session.tipoUsuario == 'professor'}">
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#adicionarConteudoModal">Adicionar Conteúdo</button>
            <!-- ADICIONAR DE CONTEÚDOS -->
            <div class="modal fade" id="adicionarConteudoModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title">Adicionar Conteúdo</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/turmas/{id}/conteudos(id=${turma.id})}" th:object="${conteudo}"
                              method="post" enctype="multipart/form-data">
                            <div class="modal-body">

                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <label for="titulo" class="form-label">Nome do conteúdo</label>
                                <input id="titulo" type="text" class="form-control mb-3" th:field="*{titulo}"
                                       placeholder="Ex: Aula 1 - Introdução" required>
                                <div class="erro-campo" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>

                                <label for="url" class="form-label">URL</label>
                                <input id="url" type="text" class="form-control mb-3" th:field="*{url}"
                                       placeholder="Ex: https://...">

                                <label for="duracaoEstimada" class="form-label">Tempo de visualização</label>
                                <input id="duracaoEstimada" type="text" class="form-control mb-3" th:field="*{duracaoEstimada}"
                                       placeholder="Ex: 15 min">

                                <label for="arquivo" class="form-label">Arquivos</label>
                                <input id="arquivo" name="arquivo" type="file" class="form-control"
                                       accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.ppt,.pptx">
                                <div class="form-text">Opcional. Formatos: PDF, PNG, JPG, DOC, DOCX, PPT e PPTX. Máximo 6 MB.</div>

                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Cadastrar</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <div th:if="${session.tipoUsuario == 'professor'}">
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#adicionarPessoasModal">Adicionar Pessoas</button>

            <div class="modal fade" id="adicionarPessoasModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title">Adicionar Pessoas</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <form th:action="@{/adicionarPessoas}" th:object="${turma}" method="post">
                            <div class="modal-body">

                                <input type="hidden" th:field="*{id}" />

                                <label for="emailPessoa" class="form-label">Email da pessoa:</label>

                                <input id="emailPessoa" type="text" class="form-control" th:field="*{emailPessoa}" placeholder="Ex: 11231405551@aluno.umc.br" required>

                                <div class="erro-campo" th:if="${#fields.hasErrors('emailPessoa')}" th:errors="*{emailPessoa}"></div>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Adicionar pessoa</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

     </div>
    </main>
</body>
</html>
