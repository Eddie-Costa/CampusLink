<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="${turma.nomeTurma}">Ambiente da turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/ambienteTurmaStyle.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: nav}"></div>

    <!--Mensagem de sucesso-->
    <div th:if="${mensagemSucesso != null}" class="alert alert-success alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert" style="z-index: 1055; min-width: 280px; max-width: 420px;">
        <span th:text="${mensagemSucesso}">Mensagem de sucesso</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <!--Mensagem de erro-->
    <div th:if="${mensagemErro != null}" class="alert alert-warning alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert" style="z-index: 1055; min-width: 280px; max-width: 420px;">
        <span th:text="${mensagemErro}">Mensagem de erro</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>

    <!--Conteiner Turma-->
    <main class="container mt-4">

        <a th:href="@{/turmas}">Voltar para turmas</a>
        <h1 th:text="${turma.nomeTurma}">Nome da turma</h1>
        <p th:text="${turma.descricao}">Descrição da turma</p>

        <!--
           Visualização do professor
           contem:
           Botão participantes da turma

           Se for admin:
           Botão excluir turma
        -->
        <div th:if="${session.tipoUsuario == 'professor'}">

            <!--
            Botáo para abrir o modal participantes da turma
            Modal contem:
            email das pessoas cadastradas na turma | tipo de usuario (aluno, professor, professor admin)
            Botão adicionar pessoas e Botão remover pessoas
            -->
            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#participantesTurma">Participantes da Turma</button>

            <!--Modal participantes Turma-->
            <div class="modal fade" id="participantesTurma" tabindex="-1" aria-labelledby="participantesTurmaLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-lg">
                    <div class="modal-content campus-modal">

                        <!--
                        Header modal
                        Titulo
                        botáo fechar
                        -->
                        <div class="modal-header">
                            <h5 class="modal-title" id="participantesTurmaLabel">Participantes da turma</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>

                        <!--
                        Visualização de Participantes cadastrados
                        E-mail | Tipo de usuario
                        -->
                        <div class="modal-body">

                            <!--Tabela de pessoas-->
                            <div th:unless="${#lists.isEmpty(participantesTurma)}">
                                <table class="table table-striped table-hover align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th scope="col">E-mail</th>
                                        <th scope="col">Tipo de usuário</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="participante : ${participantesTurma}">
                                        <td th:text="${participante.emailPessoa}">email@exemplo.com</td>
                                        <td th:text="${participante.tipoUsuario}">Professor</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!--Botoes adicionarPessoas e RemoverPessoas-->
                        <div class="modal-footer">
                            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#adicionarPessoasModal">Adicionar Pessoas</button>
                            <button type="button" class="acao-turma" data-bs-toggle="modal" data-bs-target="#removerPessoasModal">Remover Pessoas</button>
                        </div>
                    </div>
                </div>
            </div>

            <!--Modal adicionarPessoas-->
            <div class="modal fade" id="adicionarPessoasModal" tabindex="-1" aria-labelledby="adicionarPessoasModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title" id="adicionarPessoasModalLabel">Adicionar Pessoas</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>

                        <form th:action="@{/adicionarPessoas}" th:object="${turma}" method="post">
                            <div class="modal-body">

                                <input type="hidden" th:field="*{id}" />

                                <label for="emailPessoaAdicionar" class="form-label">Email da pessoa:</label>
                                <input id="emailPessoaAdicionar" type="text" class="form-control" th:field="*{emailPessoa}" placeholder="Ex: 11231405551@aluno.umc.br" required>

                                <div class="erro-campo" th:if="${#fields.hasErrors('emailPessoa')}" th:errors="*{emailPessoa}"></div>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Adicionar pessoa</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

            <!--Modal removerPessoas-->
            <div class="modal fade" id="removerPessoasModal" tabindex="-1" aria-labelledby="removerPessoasModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content campus-modal">

                        <div class="modal-header">
                            <h5 class="modal-title" id="removerPessoasModalLabel">Remover Pessoas</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                        </div>

                        <form th:action="@{/removerPessoas}" th:object="${turma}" method="post">
                            <div class="modal-body">

                                <input type="hidden" th:field="*{id}" />

                                <label for="emailPessoaRemover" class="form-label">Email da pessoa:</label>
                                <input id="emailPessoaRemover" type="text" class="form-control" th:field="*{emailPessoa}" placeholder="Ex: 11231405551@aluno.umc.br" required>

                                <div class="erro-campo" th:if="${#fields.hasErrors('emailPessoa')}" th:errors="*{emailPessoa}"></div>
                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-campus">Remover pessoa</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

            <!--
            Botão excluir turma
            Só aparece se for um professor e for um admin da turma
            Antes de enviar aparece uma caixa de confirmação anunciando o perigo de seguir com a ação
            -->
            <form th:if="${isTurmaAdmin}" th:action="@{/excluirTurma}" th:object="${turma}" method="post" class="d-inline-block ms-2" onsubmit="return confirm('Tem certeza que deseja excluir esta turma? Isso removerá também todos os alunos e professores vinculados a ela.');">
                <input type="hidden" th:field="*{id}" />
                <button type="submit" class="btn btn-danger">Excluir Turma</button>
            </form>
        </div>
    </main>

    <!--Ao enviar uma ação re-abre o modal participantes-->
    <script th:if="${abrirModalParticipantes}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const modalElement = document.getElementById('participantesTurma');
            if (modalElement) {
                const modal = new bootstrap.Modal(modalElement);
                modal.show();
            }
        });
    </script>
</body>
</html>
