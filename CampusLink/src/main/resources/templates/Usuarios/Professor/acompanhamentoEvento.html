<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${'Acompanhamento - ' + evento.nome}">Acompanhamento do evento</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/turmasStyle.css}">
</head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="turmas-page">
    <div class="turmas-container turmas-container-larga">

        <a class="voltar-turmas" th:href="@{/acompanhamento/turma/{id}(id=${turma.id})}">← Voltar à turma</a>

        <div class="conteudo-card mb-4">
            <div>
                <h1 class="conteudo-nome m-0"
                    th:text="${evento.nome + ' · ' + #temporals.format(evento.inicio, 'dd/MM')}">Prova · 18/10</h1>
                <span class="conteudo-meta" th:text="${turma.nomeTurma}">Turma #1</span>
                <span class="selo-risco risco-atrasado mt-2" th:if="${eventoPassado}">Evento encerrado</span>
            </div>
            <span class="conteudo-meta" th:text="${#lists.size(alunos) + ' alunos'}">30 alunos</span>
        </div>

        <div class="sem-turmas" th:if="${#lists.isEmpty(alunos)}">
            <p>Esta turma ainda não possui alunos.</p>
        </div>

        <div class="bg-white rounded-4 shadow-sm p-3" th:unless="${#lists.isEmpty(alunos)}">
            <div class="table-responsive">
                <table class="table table-sm table-hover table-bordered align-middle text-center mb-0 tabela-acompanhamento"
                       th:style="${'width: ' + (680 + 130 * #lists.size(conteudos)) + 'px'}">
                    <colgroup>
                        <col class="coluna-aluno">
                        <col class="coluna-conteudo" th:each="conteudo : ${conteudos}">
                        <col class="coluna-conclusao">
                        <col class="coluna-ritmo">
                        <col class="coluna-situacao">
                    </colgroup>
                    <thead>
                    <tr>
                        <th scope="col" class="text-start">Aluno</th>
                        <th scope="col" th:each="conteudo : ${conteudos}"
                            th:text="${conteudo.titulo}" th:title="${conteudo.titulo}"
                            class="text-truncate">Conteúdo</th>
                        <th scope="col">Conclusão</th>
                        <th scope="col" title="Horas de conteúdo concluídas nos últimos 7 dias, em todas as turmas">Concluído (7 dias)</th>
                        <th scope="col">Situação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="aluno : ${alunos}"
                        th:with="niveis=${nivelPorAlunoEConteudo.get(aluno.idPerfil)}">
                        <th scope="row" class="text-start" th:text="${aluno.nome}">Aluno 1</th>
                        <td th:each="conteudo : ${conteudos}">
                            <span th:replace="~{fragments/risco :: ponto(${niveis.get(conteudo.id) ?: 'sem_evento'})}"></span>
                        </td>
                        <td th:text="${concluidosPorAluno.get(aluno.idPerfil) + '/' + #lists.size(conteudos)}">0/0</td>
                        <td th:text="${horasSemanaPorAluno.get(aluno.idPerfil)}">0h</td>
                        <td>
                            <span th:replace="~{fragments/risco :: selo(${situacaoPorAluno.get(aluno.idPerfil)}, null)}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
