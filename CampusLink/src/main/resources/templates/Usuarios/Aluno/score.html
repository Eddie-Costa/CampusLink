<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Score</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Geral/turmasStyle.css}">
</head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<div th:if="${mensagemErro != null}" class="alert alert-warning alert-dismissible fade show alerta-flutuante" role="alert">
    <span th:text="${mensagemErro}">Mensagem de erro</span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
</div>

<main class="turmas-page">
    <div class="turmas-container">

        <div class="sem-turmas" th:if="${#lists.isEmpty(turmas)}">
            <p>Você ainda não está em nenhuma turma.</p>
        </div>

        <div class="lista-turmas" th:unless="${#lists.isEmpty(turmas)}">
            <a class="turma-card" th:each="turma : ${turmas}"
               th:with="evento=${proximoEventoPorTurma.get(turma.id)}"
               th:href="@{/score/turma/{id}(id=${turma.id})}">

                <span class="turma-nome" th:text="${turma.nomeTurma}" th:title="${turma.nomeTurma}">Turma #1</span>

                <span class="small"
                      th:text="${concluidosPorTurma.get(turma.id) + '/' + totalPorTurma.get(turma.id) + ' conteúdos concluídos'}">
                    0/0 conteúdos concluídos
                </span>

                <span th:replace="~{fragments/risco :: selo(${evento != null ? evento.nivel : 'sem_evento'}, ${evento != null ? evento.motivo : null})}"></span>

                <span class="small" th:if="${evento != null}"
                      th:text="${evento.nomeEvento + ' · ' + #temporals.format(evento.dataEvento, 'dd/MM')}">
                    Prova · 18/10
                </span>
            </a>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
