<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login de Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <div th:replace="~{fragments/header :: nav}"></div>

    <main>
        <h1 class="title">LOGIN Aluno</h1>
        <form th:action="@{/loginAluno}" th:object="${aluno}" method="post" class="form-login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="label_info">E-mail</label>
            <input name="email" th:value="${email}" type="email" required class="textbox">

            <label class="label_info">Senha:</label>
            <input name="senha" th:value="${senha}" type="password" class="textbox" required pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}$" title="A senha deve ter pelo menos 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial">

            <button type="submit" class="Sendbutton">Entrar</button>
            <p name="mensagemDeErro" th:text="${mensagemDeErro}"></p>

            <div class="linksuteis" >
                <a href="/cadastrarAluno" class="link_pull">Não tem cadastro em nossa plataforma? clique aqui para Cadastrar</a>
                <a href="/loginProfessor" class="link_pull">É um professor? clique aqui para Logar</a>
            </div>

        </form>
    </main>
</body>
</html>
