<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Alunos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Usuarios/cadastrarStyle.css}">
</head>

<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div id="modalTermos" class="modal fade" tabindex="-1" aria-labelledby="tituloTermos" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="tituloTermos" class="modal-title fs-5">Termos de Uso</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>

            <div id="textoTermos" class="modal-body termos-documento" th:attr="data-url=@{/documentos/termos-v1.0.txt}" aria-live="polite">
                Carregando termos...
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/header :: nav}"></div>

<main>
    <h1 class="title">Cadastrar Aluno</h1>

    <form action="/cadastrarAluno" th:object="${aluno}" method="post" class="form-cadastrarAluno">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label class="label_info">RGM</label>
        <input name="rgm" th:value="${rgm}" type="text" inputmode="numeric" id="rgm" required pattern="^\d{11}$"
               maxlength="11" minlength="11" title="A matrícula deve ter exatamente 11 números"
               placeholder="Ex: 12345678901" class="textbox">

        <label class="label_info">Nome</label>
        <input name="nome" th:value="${nome}" type="text" id="nome" required pattern="^[a-zA-Z\s]{2,50}$"
               maxlength="50" minlength="1" title="O nome deve ter entre 2 e 50 caracteres"
               placeholder="Ex: João da Silva" class="textbox">

        <label class="label_info">E-mail</label>
        <input name="email" th:value="${email}" type="email" id="email" required
               pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{5,100}$"
               maxlength="100" minlength="5" title="O e-mail deve ser válido"
               placeholder="Ex: joao@email.com" class="textbox">

        <label class="label_info">Telefone</label>
        <input name="telefone" th:value="${telefone}" type="text" inputmode="numeric" id="telefone" required
               pattern="^\d{10,13}$" maxlength="11" minlength="10"
               title="O telefone deve ter entre 10 e 11 números, não deve conter codigo de pais (DDI)"
               placeholder="Ex: 991234567" class="textbox">

        <label class="label_info">Data de nascimento</label>
        <input name="dataNasc" th:value="${dataNasc}" type="date" id="datanasc" required
               title="Selecione sua data de nascimento" class="textbox">

        <div class="termos-container">
            <label for="termos" class="label_info">Eu aceito os</label>

            <button type="button" class="abrir-termos btn btn-link p-0"
                    data-bs-toggle="modal" data-bs-target="#modalTermos">
                Termos de Uso
            </button>

            <input name="termos" type="checkbox" required disabled class="checkbox" id="termos"
                   aria-describedby="orientacaoTermos">

            <small id="orientacaoTermos">Abra os termos para habilitar o aceite.</small>
        </div>

        <label class="label_info">Senha:</label>
        <input name="senha" th:value="${senha}" type="password" id="senha" required
               pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}$"
               title="A senha deve ter pelo menos 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial"
               placeholder="Digite sua senha" class="textbox">

        <button type="submit" id="btnSubmit" disabled class="Sendbutton">Registrar</button>

        <p name="mensagemDeErro" th:text="${mensagemDeErro}"></p>

        <div class="linksuteis">
            <a href="/login" class="link_pull">Ja tem cadastro em nossa plataforma? clique aqui para Logar</a>
            <a href="/cadastrarProfessor" class="link_pull">É um professor? clique aqui para cadastrar-se</a>
        </div>
    </form>
</main>

<script th:src="@{/js/Usuarios/termos.js}"></script>
<script th:src="@{/js/Usuarios/Aluno/cadastrarAluno.js}"></script>

</body>
</html>
