<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/loginStyle.css}">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div th:replace="~{fragments/header :: nav}"></div>

<main>
    <h1 class="title">LOGIN ADMINISTRADOR</h1>

    <form th:action="@{/gestao/8f3c1d7a-2b94-4e61-a5c8-7d2f9b4a6e31}" th:object="${admin}" method="post" class="form-login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <label class="label_info">E-mail</label>
        <input name="email" th:value="${email}" type="email" required class="textbox">

        <label class="label_info">Senha:</label>
        <input name="senha" th:value="${senha}" type="password" class="textbox" required
               pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}$"
               title="A senha deve ter pelo menos 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial">

        <button type="submit" class="Sendbutton">Entrar</button>

        <p name="mensagemDeErro" th:text="${mensagemDeErro}"></p>
    </form>
</main>
</body>
</html>
