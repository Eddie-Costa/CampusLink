<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastrar Turma | CampusLink</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Usuarios/Admin/cadastrarTurmaAdmin.css}">
</head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="cadastrar-turma-admin-page">

    <div class="cadastrar-turma-admin-container">

        <div class="cadastrar-turma-admin-topo">

            <div>
                <p class="cadastrar-turma-admin-etiqueta">Administração</p>
                <h1>Cadastrar turma</h1>
                <p>Cadastre uma nova turma no CampusLink</p>
            </div>

            <a th:href="@{/admin/turmas}" class="cadastrar-turma-admin-voltar">
                Voltar para turmas
            </a>

        </div>

        <div th:if="${mensagemErro}" class="alert alert-danger cadastrar-turma-admin-mensagem" th:text="${mensagemErro}"></div>

        <div th:if="${#lists.isEmpty(professores)}" class="alert alert-warning cadastrar-turma-admin-mensagem">
            Nenhum professor ativo foi encontrado. Cadastre ou ative um professor antes de criar uma turma.
        </div>

        <section class="cadastrar-turma-admin-card">

            <form th:action="@{/admin/turmas/cadastrar}" th:object="${turma}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="cadastrar-turma-admin-grupo">

                    <label for="nomeTurma">Nome da turma</label>

                    <input type="text" id="nomeTurma" class="cadastrar-turma-admin-input" th:field="*{nomeTurma}" placeholder="Ex: Engenharia de Software 8B">

                    <div class="cadastrar-turma-admin-erro" th:if="${#fields.hasErrors('nomeTurma')}" th:errors="*{nomeTurma}">
                        Erro
                    </div>

                </div>

                <div class="cadastrar-turma-admin-grupo">

                    <label for="descricao">Descrição</label>

                    <textarea id="descricao" class="cadastrar-turma-admin-textarea" th:field="*{descricao}" placeholder="Digite uma descrição para a turma"></textarea>

                </div>

                <div class="cadastrar-turma-admin-grupo">

                    <label for="idProprietario">Professor responsável</label>

                    <select id="idProprietario" class="cadastrar-turma-admin-select" th:field="*{idProprietario}">

                        <option value="">Selecione um professor</option>

                        <option th:each="professor : ${professores}" th:value="${professor.idPerfil}" th:text="${professor.nome + ' - Matrícula: ' + professor.identificador}">
                            Professor
                        </option>

                    </select>

                    <div class="cadastrar-turma-admin-erro" th:if="${#fields.hasErrors('idProprietario')}" th:errors="*{idProprietario}">
                        Erro
                    </div>

                </div>

                <div class="cadastrar-turma-admin-acoes">

                    <a th:href="@{/admin/turmas}" class="cadastrar-turma-admin-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="cadastrar-turma-admin-salvar" th:disabled="${#lists.isEmpty(professores)}">
                        Cadastrar turma
                    </button>

                </div>

            </form>

        </section>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
