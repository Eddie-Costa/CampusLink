<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar Usuário | CampusLink</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/Usuarios/Admin/cadastrarUsuarioAdmin.css}">
</head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="cadastro-admin-page">
    <div class="cadastro-admin-container">

        <header class="cadastro-admin-topo">
            <div>
                <p class="cadastro-admin-etiqueta">Administração</p>
                <h1>Cadastrar usuário</h1>
                <p>Cadastre um novo aluno ou professor no CampusLink</p>
            </div>

            <a th:href="@{/admin/usuarios}" class="cadastro-admin-voltar">Voltar</a>
        </header>

        <div th:if="${mensagemErro}" class="alert alert-danger cadastro-admin-mensagem" th:text="${mensagemErro}"></div>

        <section class="cadastro-admin-card">

            <div class="cadastro-admin-card-topo">
                <h2>Novo usuário</h2>
            </div>

            <form th:action="@{/admin/usuarios/cadastrar}" th:object="${usuario}" method="post" class="cadastro-admin-form">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="cadastro-admin-campo">
                    <label for="perfil">Perfil</label>

                    <select id="perfil" th:field="*{perfil}" required>
                        <option value="">Selecione o perfil</option>
                        <option value="Aluno">Aluno</option>
                        <option value="Professor">Professor</option>
                    </select>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="identificador">RGM ou matrícula</label>

                    <input id="identificador" th:field="*{identificador}" type="text" maxlength="11" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('identificador')}" th:errors="*{identificador}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="nome">Nome</label>

                    <input id="nome" th:field="*{nome}" type="text" maxlength="50" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="email">E-mail</label>

                    <input id="email" th:field="*{email}" type="email" maxlength="100" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="telefone">Telefone</label>

                    <input id="telefone" th:field="*{telefone}" type="text" maxlength="13" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="dataNasc">Data de nascimento</label>

                    <input id="dataNasc" th:field="*{dataNasc}" type="date" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('dataNasc')}" th:errors="*{dataNasc}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="senha">Senha inicial</label>

                    <input id="senha" th:field="*{senha}" type="password" minlength="8" required>

                    <p class="cadastro-admin-ajuda">
                        A senha deve ter pelo menos 8 caracteres, com maiúscula, minúscula, número e caractere especial
                    </p>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                </div>

                <div class="cadastro-admin-campo">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <input id="confirmarSenha" th:field="*{confirmarSenha}" type="password" minlength="8" required>

                    <div class="cadastro-admin-erro" th:if="${#fields.hasErrors('confirmarSenha')}" th:errors="*{confirmarSenha}"></div>
                </div>

                <div class="cadastro-admin-acoes">
                    <a th:href="@{/admin/usuarios}" class="cadastro-admin-cancelar">Cancelar</a>

                    <button type="submit" class="cadastro-admin-salvar">
                        Cadastrar usuário
                    </button>
                </div>

            </form>

        </section>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
