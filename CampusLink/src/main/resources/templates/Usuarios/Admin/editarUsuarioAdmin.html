<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuário | CampusLink</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/editarUsuarioAdmin.css}">
</head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<main class="editar-admin-page">
    <div class="editar-admin-container">

        <header class="editar-admin-topo">
            <div>
                <p class="editar-admin-etiqueta">Administração</p>
                <h1>Editar usuário</h1>
                <p>Atualize as informações do aluno ou professor</p>
            </div>

            <a th:href="@{/admin/usuarios}" class="editar-admin-voltar">Voltar</a>
        </header>

        <div th:if="${mensagemErro}" class="alert alert-danger editar-admin-mensagem" th:text="${mensagemErro}"></div>

        <section class="editar-admin-card">

            <div class="editar-admin-card-topo">
                <h2 th:text="${usuario.nome}">Usuário</h2>
            </div>

            <form th:action="@{/admin/usuarios/{idUsuario}/editar(idUsuario=${usuario.idUsuario})}"
                  th:object="${usuario}"
                  method="post"
                  class="editar-admin-form">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}">
                <input type="hidden" name="idPerfil" th:value="${usuario.idPerfil}">
                <input type="hidden" name="perfil" th:value="${usuario.perfil}">

                <div class="editar-admin-campo">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" th:value="${usuario.nome}" required>
                </div>

                <div class="editar-admin-campo">
                    <label for="identificador"
                           th:text="${usuario.perfil == 'Aluno' ? 'RGM' : 'Matrícula'}">
                        Identificador
                    </label>

                    <input id="identificador" name="identificador" type="text"
                           th:value="${usuario.identificador}" required>
                </div>

                <div class="editar-admin-campo">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email"
                           th:value="${usuario.email}" required>
                </div>

                <div class="editar-admin-campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="text"
                           th:value="${usuario.telefone}" required>
                </div>

                <div class="editar-admin-campo">
                    <label for="dataNasc">Data de nascimento</label>
                    <input id="dataNasc" name="dataNasc" type="date"
                           th:value="${usuario.dataNasc}" required>
                </div>

                <div class="editar-admin-campo">
                    <label for="perfilUsuario">Perfil</label>
                    <input id="perfilUsuario" type="text"
                           th:value="${usuario.perfil}" readonly>
                </div>

                <div class="editar-admin-acoes">
                    <a th:href="@{/admin/usuarios}" class="editar-admin-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="editar-admin-salvar">
                        Salvar alterações
                    </button>
                </div>

            </form>

        </section>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
